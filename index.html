    // guideLayer 與 canvas 同框，0.5×寬 = canvas cw/2 = 吸附中心線位置，兩者精準重合。
    const w = guideLayer.clientWidth, h = guideLayer.clientHeight;
    vGuides.forEach(g=>{ g.style.left = (parseFloat(g.dataset.gx)*w)+'px'; });
    hGuides.forEach(g=>{ g.style.top  = (parseFloat(g.dataset.gy)*h)+'px'; });
  }
  layoutGuides();
  window.addEventListener('resize', layoutGuides);

  function hideGuides(){ guideLayer.querySelectorAll('.guide-line').forEach(g=>g.classList.remove('show')); }

  // v34：固定像素格距（正方形格線）。GRID_PX 同時驅動 CSS 背景與吸附，兩邊保證對齊。
  const GRID_PX = 40;
  canvas.classList.add('show-grid');
  canvas.style.setProperty('--gridPx', GRID_PX+'px');

  // 算出吸附後的 posX/posY，吸到最近的網格線（交界處卡一下）
  // baseCx/baseCy 使用按下瞬間量好的固定基準，不在拖曳中重量，避免回饋迴圈造成抖動
  function snapPos(px, py){
    const cv = canvas;                  // 用 canvas 盒座標，與 text-block 的 offsetLeft/Top 同一基準
    const cw = cv.clientWidth, ch = cv.clientHeight;
    const baseCx = dragBaseCx;
    const baseCy = dragBaseCy;
    hideGuides();
    let outX = px, outY = py;

    // 橫向：以預覽區中心為原點，往兩邊每 GRID_PX 一條垂直線。確保中心線存在。
    const cxLine = cw/2;
    let bestVDist=SNAP+1, bestVX=null, bestVLine=0;
    for(let gx = cxLine % GRID_PX; gx <= cw; gx += GRID_PX){
      const targetPx = gx - baseCx;        // 要讓文字中心落在 gx，需要的 posX
      const d = Math.abs(targetPx - px);
      if(d < bestVDist){ bestVDist=d; bestVX=Math.round(targetPx); bestVLine=gx; }
    }
    if(bestVX!=null && bestVDist<=SNAP){ outX=bestVX; showGuideAt('v', bestVLine); }

    // 縱向：以中心為原點往兩邊每 GRID_PX 一條水平線
    const cyLine = ch/2;
    let bestHDist=SNAP+1, bestHY=null, bestHLine=0;
    for(let gy = cyLine % GRID_PX; gy <= ch; gy += GRID_PX){
      const targetPy = gy - baseCy;
      const d = Math.abs(targetPy - py);
      if(d < bestHDist){ bestHDist=d; bestHY=Math.round(targetPy); bestHLine=gy; }
    }
    if(bestHY!=null && bestHDist<=SNAP){ outY=bestHY; showGuideAt('h', bestHLine); }

    return [outX, outY];
  }
  // 動態高亮被吸附到的那條網格線（亮橘，疊在淡格線上）
  function showGuideAt(dir, pos){
    let el = guideLayer.querySelector('.grid-snap.'+dir);
    if(!el){ el=document.createElement('div'); el.className='guide-line grid-snap '+dir+' center'; guideLayer.appendChild(el); }
    /* v45：pos 是 canvas 盒座標，但線畫在 guideLayer（canvasWrap）上。
       canvas 在 wrap 裡有 padding/border 造成的偏移，補上去才會對齊格線與字。 */
    const cr=canvas.getBoundingClientRect();
    const gr=guideLayer.getBoundingClientRect();
    const offX=cr.left-gr.left, offY=cr.top-gr.top;
    if(dir==='v'){ el.style.left=(pos+offX)+'px'; } else { el.style.top=(pos+offY)+'px'; }
    el.classList.add('show');
  }

  // v66：雙指旋轉吸附線——轉到水平/垂直時，穿過「被旋轉那一行的中心」亮一條對應方向的線。
  // dir 為 null 表示本幀沒吸附 → 把線收掉。線是動態建立、掛在 guideLayer 上，
  // hideGuides() 會一併隱藏（它掃的是所有 .guide-line）。
  function showRotSnapGuide(dir){
    guideLayer.querySelectorAll('.rot-snap').forEach(g=>g.classList.remove('show'));
    if(!dir) return;
    const col=block.querySelector('.col[data-line-idx="'+selLine+'"]');
    if(!col) return;
    let el=guideLayer.querySelector('.rot-snap.'+dir);
    if(!el){ el=document.createElement('div'); el.className='guide-line rot-snap '+dir+' center'; guideLayer.appendChild(el); }
    const r=col.getBoundingClientRect(), gr=guideLayer.getBoundingClientRect();
    if(dir==='h'){ el.style.top =(((r.top+r.bottom)/2)-gr.top )+'px'; }
    else         { el.style.left=(((r.left+r.right)/2)-gr.left)+'px'; }
    el.classList.add('show');
  }

  // v63：找出某螢幕座標下是哪一行的字（用 .col 的 lineIdx）。guideLayer 是 pointer-events:none，
  // 不會擋住命中測試；按到空白處回傳 null（維持目前選中行，仍可在空白拖曳）。
  function lineIdxAtPoint(x,y){
    let el=document.elementFromPoint(x,y);
    const col = el && el.closest ? el.closest('.col') : null;
    if(!col) return null;
    const i=parseInt(col.dataset.lineIdx,10);
    return Number.isFinite(i)?i:null;
  }
  function onDown(e){
    if(editOpen) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    // v63：第一指按下 → 手指壓在哪一行就選哪一行（之後的移動/雙指縮放/旋轉都作用在那一行）
    if(ptrs.size===1){
      const li=lineIdxAtPoint(e.clientX,e.clientY);
      if(li!=null && li!==selLine){ setSelLine(li); }
    }
    if(ptrs.size>=2){
      /* 第二指落下 → 雙指縮放。
         關鍵：先放掉第一指的 pointer capture，否則 capture 會把所有 pointer 事件
         獨佔導向第一指，第二指的 move 收不到，pinch 永遠算不出距離變化。 */
      if(pointerId!=null && canvas.releasePointerCapture){ try{ canvas.releasePointerCapture(pointerId); }catch(_){} }
      pointerId=null;
      pinching=true; dragging=false; moved=true;
      const a=[...ptrs.values()];
      pinchStartDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
      ensureLineStyles();
      const _ps=lineStyles[selLine]||{};
      pinchStartScale=(typeof _ps.lscale==='number'?_ps.lscale:1);
      pinchStartAngle=Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x);   // 兩指連線起始角度
      pinchStartRot=(_ps.lrot||0);
      pinchStartCx=(a[0].x+a[1].x)/2; pinchStartCy=(a[0].y+a[1].y)/2;
      pinchBaseX=_ps.lpx||0; pinchBaseY=_ps.lpy||0;
      canvas.classList.remove('dragging');
      hideGuides();   // v66.1：收掉單指拖曳殘留的網格吸附線，否則會跟旋轉吸附線同時亮成兩三條
      e.preventDefault();
      return;
    }
    dragging = true; moved = false;
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    ensureLineStyles();
    const _ds=lineStyles[selLine]||{};
    baseX = _ds.lpx||0; baseY = _ds.lpy||0;
    // v46：dragBaseCx/Cy 要的是「posX=0 時的排版中心」。offsetLeft/Top 是版面座標，
    // 本來就不含 transform(translate)，所以直接就是 posX=0 的中心，千萬不能再扣 posX/posY，
    // 否則文字已被移動過(posX≠0)時吸附目標會整個偏掉 → 十字線跑掉、X/Y 不歸零。
    dragBaseCx = block.offsetLeft + block.offsetWidth/2;
    dragBaseCy = block.offsetTop + block.offsetHeight/2;
    canvas.classList.add('dragging');
    /* v31：不在此處 setPointerCapture。先前在第一指就 capture 會獨佔事件、擋掉第二指，
       導致無法雙指縮放。改成等 onMove 確認真的是單指拖曳後再 capture。 */
    e.preventDefault();
  }
  function onMove(e){
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinching && ptrs.size>=2){
      const a=[...ptrs.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
      let nsc=pinchStartScale*(d/pinchStartDist);
      nsc=Math.max(0.2,Math.min(4,nsc));
      const st=lineStyles[selLine];
      let rotSnapDir=null;   // v66：本幀是否吸附到水平/垂直（'h'/'v'），決定要亮哪條線
      if(st){
        st.lscale=nsc;
        // 旋轉：兩指連線角度的變化量，加到該行起始旋轉
        const ang=Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x);
        let deg=pinchStartRot + (ang-pinchStartAngle)*180/Math.PI;
        deg=((deg%360)+360)%360;
        /* v66：旋轉吸附——接近 0/90/180/270 度（±ROT_SNAP 度內）就卡到正角度，
           做出「轉到水平/垂直會卡一下」的手感，並亮出對應方向的參考線。
           吸附線方向跟著「視覺方向」走：橫書 0/180=水平線、90/270=垂直線；
           直書的行本身是直的，0/180 反而是垂直線。 */
        const ROT_SNAP=6;
        const near=Math.round(deg/90)*90;
        if(Math.abs(deg-near)<=ROT_SNAP){
          deg=((near%360)+360)%360;
          const flat=(deg===0||deg===180);   // 行回到自然方向
          rotSnapDir = (textDirection==='v') ? (flat?'v':'h') : (flat?'h':'v');
          if(navigator.vibrate){ if(!onMove._lastSnap || onMove._lastSnap!==deg){ try{navigator.vibrate(10);}catch(_){}} onMove._lastSnap=deg; }
        } else { onMove._lastSnap=null; }
        st.lrot=deg;
        // 平移：兩指中心位移
        const cx=(a[0].x+a[1].x)/2, cy=(a[0].y+a[1].y)/2;
        const sc=autoScale||1;
        st.lpx=Math.round(pinchBaseX+(cx-pinchStartCx)/sc);
        st.lpy=Math.round(pinchBaseY+(cy-pinchStartCy)/sc);
      }
      applyLineTransforms(); updatePosReadout();
      showRotSnapGuide(rotSnapDir);
      e.preventDefault();
      return;
    }
    if(!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3){
      if(!moved && pointerId!=null && canvas.setPointerCapture){ try{ canvas.setPointerCapture(pointerId); }catch(_){} }
      moved = true;
    }
    const s = autoScale || 1;          // 拖動量除以縮放，手感才一致
    let nx = Math.round(baseX + dx/s);
    let ny = Math.round(baseY + dy/s);
    const st=lineStyles[selLine];
    if(st){
      st.lpx=nx; st.lpy=ny;
      applyLineTransforms();   // 先套用「跟手」位置，才能量到該行目前中心
      /* v64：把網格吸附接回單指拖曳（之前改 per-line 時被拿掉，導致吸附線拖曳時不亮）。
         對「被拖那一行的中心」找最近格線；命中(<=SNAP)就微調 lpx/lpy 讓中心吸到格線上，
         並點亮對應的十字線。平常隱形、只有吸附當下亮。 */
      hideGuides();
      const col = block.querySelector('.col[data-line-idx="'+selLine+'"]');
      if(col){
        const cvr=canvas.getBoundingClientRect();
        const cr=col.getBoundingClientRect();
        const cw=canvas.clientWidth, chh=canvas.clientHeight;
        let lineCx=(cr.left+cr.right)/2 - cvr.left;   // canvas 盒內 px（canvas 不縮放）
        let lineCy=(cr.top+cr.bottom)/2 - cvr.top;
        // 垂直格線通過中心，每 GRID_PX 一條
        const nVx=Math.round((lineCx-cw/2)/GRID_PX)*GRID_PX + cw/2;
        if(Math.abs(lineCx-nVx)<=SNAP){ st.lpx = nx + (nVx-lineCx)/s; showGuideAt('v', nVx); }
        const nHy=Math.round((lineCy-chh/2)/GRID_PX)*GRID_PX + chh/2;
        if(Math.abs(lineCy-nHy)<=SNAP){ st.lpy = ny + (nHy-lineCy)/s; showGuideAt('h', nHy); }
        st.lpx=Math.round(st.lpx); st.lpy=Math.round(st.lpy);
        applyLineTransforms();   // 套用吸附後的最終位置
      }
    }
    updatePosReadout();
    e.preventDefault();
  }
  function onUp(e){
    ptrs.delete(e.pointerId);
    if(pinching){
      if(ptrs.size>=2){ return; }   // 還有兩指以上，繼續 pinch
      if(ptrs.size===1){
        /* v41：雙指放開到剩一指 → 無縫接管成單指拖曳。
           用剩下那指當新起點、以目前 posX/posY 為基準，避免停住或跳位。 */
        pinching=false;
        const p=[...ptrs.entries()][0];   // [pointerId, {x,y}]
        pointerId=p[0];
        startX=p[1].x; startY=p[1].y;
        const _us=lineStyles[selLine]||{};
        baseX=_us.lpx||0; baseY=_us.lpy||0;
        dragging=true; moved=true;        // 接續手勢，放開時不觸發進入編輯
        dragBaseCx = block.offsetLeft + block.offsetWidth/2;   // v46：同上，不扣 posX/posY
        dragBaseCy = block.offsetTop + block.offsetHeight/2;
        canvas.classList.add('dragging');
        if(pointerId!=null && canvas.setPointerCapture){ try{ canvas.setPointerCapture(pointerId); }catch(_){} }
        return;
      }
      // ptrs.size===0：全放開
      pinching=false; dragging=false; canvas.classList.remove('dragging'); hideGuides();
      syncLineXformControls(); persist();
      return;
    }
    if(!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    hideGuides();
    if(pointerId!=null && canvas.releasePointerCapture){ try{ canvas.releasePointerCapture(pointerId); }catch(_){} }
    pointerId = null;
    if(!moved){ openEdit(); }   // 沒拖動 = 點按 → 進入編輯模式
    else { syncLineXformControls(); persist(); }   // 拖動結束：同步滑桿(縮放/旋轉/位置)並存檔
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
})();

// 點預覽 → 浮動輸入框
// ─────────────────────────────────────────────────────────
//  全螢幕編輯模式：即時鍵盤輸入 + 字型橫列 + 大小滑桿 + 顏色
// ─────────────────────────────────────────────────────────
let editOpen = false;
let editPrevParent = null;   // 記住 canvasWrap 原本的位置，關閉時還原

// 字型清單（key + 顯示名 + family）取自主工具列
function editFontList(){
  return [...document.querySelectorAll('.font-btn')]
    .filter(b=>b.id && b.id.startsWith('fb-') && /setFont\('/.test(b.getAttribute('onclick')||''))
    .map(b=>({
      key: (b.getAttribute('onclick').match(/setFont\('([^']+)'/)||[])[1],
      name: (b.querySelector('.fn')?.textContent||'').trim(),
      fam: (b.querySelector('.fp')?.getAttribute('style')||'').replace('font-family:','').replace(/;$/,''),
      btn: b
    }))
    .filter(f=>f.key);
}

function buildEditFontRow(){
  const row=document.getElementById('editFontRow');
  row.innerHTML='';
  editFontList().forEach(f=>{
    const b=document.createElement('button');
    b.className='ef-btn'+(f.btn.classList.contains('on')?' on':'');
    b.textContent=f.name;
    b.style.fontFamily=f.fam;
    b.dataset.key=f.key;
    b.onclick=()=>{
      setFont(f.key, f.btn);                 // 重用主邏輯（會 render）
      row.querySelectorAll('.ef-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      /* v24：setFont 走主 render() 會把編輯模式畫好的顏色蓋成預設白色。
         這裡重跑 renderLite，把編輯渲染（含目前選的顏色）重新套回去。 */
      if(typeof renderLite==='function') renderLite();
    };
    row.appendChild(b);
  });
}

// 顏色面板：色票列 + HSL 滑桿
function buildEditColorRow(){
  const row=document.getElementById('editSwatchRow');
  row.innerHTML='';
  presets.forEach((p,i)=>{
    const s=document.createElement('button');
    s.className='ec-sw'+(colorMode==='preset'&&curPal===p?' on':'');
    s.style.background=`linear-gradient(160deg,${p.hi},${p.base},${p.dark})`;
    s.onclick=()=>{
      const mainSw=document.querySelectorAll('.swatch')[i];
      if(mainSw){ mainSw.click(); } else { curPal=p; colorMode='preset'; render(); }
      row.querySelectorAll('.ec-sw').forEach(x=>x.classList.remove('on'));
      s.classList.add('on');
    };
    row.appendChild(s);
  });
  gradients.forEach((g)=>{
    const s=document.createElement('button');
    s.className='ec-sw'+(colorMode==='gradient'&&curGrad===g?' on':'');
    s.style.background=`linear-gradient(135deg,${g.stops[0]},${g.stops[1]},${g.stops[2]})`;
    s.onclick=()=>{
      curGrad=g; colorMode='gradient'; render();
      row.querySelectorAll('.ec-sw').forEach(x=>x.classList.remove('on'));
      s.classList.add('on');
    };
    row.appendChild(s);
  });
}

// 色相/明度滑桿 → 設成純色
function hsl2hex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const to=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return `#${to(f(0))}${to(f(8))}${to(f(4))}`;
}
// v44：編輯模式彩色鈕現在是 label 直接包住可點的透明 color input，
// 點下去 iOS 一定彈出系統調色盤。這裡只在開啟前把目前顏色帶進去當預設。
function editSeedSysColor(){
  const sys=document.getElementById('editSysColor');
  const cur=document.getElementById('solidColor');
  if(sys && cur && cur.value) sys.value=cur.value;
}
function editApplySysColor(hex){
  const inp=document.getElementById('solidColor');
  if(inp) inp.value=hex;
  colorMode='solid';
  const dot=document.getElementById('editColorDot');
  if(dot) dot.style.boxShadow=`inset 0 0 0 3px ${hex}`;
  if(typeof renderLite==='function') renderLite();
}

function editApplyHsl(){
  const h=+document.getElementById('editHue').value;
  const l=+document.getElementById('editLight').value;
  const hex=hsl2hex(h,90,l);
  const inp=document.getElementById('solidColor');
  if(inp) inp.value=hex;
  colorMode='solid';
  // 同步主工具列的純色頁籤狀態（若存在）
  if(typeof renderLite==='function') renderLite(); // v20 fix: 原本呼叫未定義的 liveRender() 會丟錯
  // 更新色盤圖示中心顏色提示
  const dot=document.getElementById('editColorDot');
  if(dot) dot.style.boxShadow=`inset 0 0 0 3px ${hex}`;
}

function getEditVisibleColor(){
  try{
    if(colorMode==='solid'){
      const el=document.getElementById('solidColor');
      if(el && el.value) return el.value;
    }
    if(colorMode==='gradient' && curGrad && curGrad.stops) return curGrad.stops[1] || curGrad.stops[0] || '#ff6a00';
    if(curPal && curPal.base) return curPal.base;
  }catch(_){ }
  return '#ff6a00';
}
function clampNum(v,min,max){ return Math.max(min, Math.min(max, v)); }
function getEditSize(){
  const el=document.getElementById('szSlider');
  const v=el ? parseInt(el.value,10) : 48;
  return clampNum(Number.isFinite(v)?v:48,4,180);
}
function setEditSize(v, liteOnly){
  v=clampNum(Math.round(v),4,180);
  const s=document.getElementById('szSlider');
  const n=document.getElementById('szVal');
  if(s) s.value=String(v);
  if(n) n.value=String(v);
  updateEditSizeRail();
  if(editOpen || liteOnly) renderLite(); else render();
}
function syncInputToLines(){
  const inp=document.getElementById('editInput');
  if(!inp) return;
  let arr=String(inp.value || '').replace(/\r/g,'').split('\n');
  arr=arr.slice(0,6).map(s=>Array.from(s).slice(0,25).join(''));
  if(arr.length===0) arr=[''];
  lines=arr;
  while(offsets.length<lines.length) offsets.push(0);
  offsets.length=lines.length;
}
function renderLite(tempText){
  const block=document.getElementById('text-block');
  if(!block) return;
  const source = (typeof tempText === 'string') ? tempText : lines.join('\n');
  let arr=String(source || '').replace(/\r/g,'').split('\n').slice(0,6);
  if(arr.length===0) arr=[''];
  block.innerHTML='';
  block.classList.add('v18-lite-editing');
  block.classList.toggle('horizontal', textDirection==='h');
  block.style.fontFamily=curFont;
  block.style.fontSize=getEditSize()+'px';
  block.style.color=getEditVisibleColor();
  block.style.transform=`translate(${posX}px,${posY}px) scale(${autoScale||1})`;
  const hasText=arr.join('').length>0;
  if(!hasText) arr=['輸入文字'];
  const renderArr = textDirection==='v' ? arr.slice().reverse() : arr;
  renderArr.forEach(function(txt){
    const line=document.createElement('div');
    line.className='v18-lite-line';
    if(!hasText) line.classList.add('is-placeholder');
    line.textContent=txt;
    block.appendChild(line);
  });
  applyPos();
}
function finalizeEditRender(){
  const block=document.getElementById('text-block');
  if(block){
    block.classList.remove('v18-lite-editing');
    block.classList.remove('lite-vmode');
    block.style.fontFamily='';
    block.style.fontSize='';
    block.style.color='';
  }
  rebuildInputs();
  rebuildOffsets();
  render();

function closeEdit(){

function updateEditSizeRail(){

function setEditSizeFromY(clientY){
  const track=document.querySelector('#editSizeRail .editRailTrack');

<script id="v18-clean-editor-script">
(function(){
  function byId(id){return document.getElementById(id);}
  function bindInput(){
    const input=byId('editInput');
    if(!input || input.dataset.v18Bound==='1') return;
    input.dataset.v18Bound='1';
    function sync(e){
      if(!editOpen) return;
      syncInputToLines();
      renderLite();
    }
    input.addEventListener('input',sync);
    input.addEventListener('change',sync);
    input.addEventListener('compositionstart',function(e){ setTimeout(sync,0); });
    input.addEventListener('compositionupdate',function(e){ setTimeout(sync,0); });
    input.addEventListener('compositionend',function(e){ setTimeout(sync,0); });
    input.addEventListener('keydown',function(e){ setTimeout(sync,0); });
    input.addEventListener('keyup',function(e){ setTimeout(sync,0); });
  }
  function bindSizeRail(){
    const rail=byId('editSizeRail');
    if(!rail || rail.dataset.v18Bound==='1') return;
    rail.dataset.v18Bound='1';
    let active=false;
    rail.addEventListener('pointerdown',function(e){active=true;setEditSizeFromY(e.clientY);try{rail.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault();});
    rail.addEventListener('pointermove',function(e){if(!active)return;setEditSizeFromY(e.clientY);e.preventDefault();});
    rail.addEventListener('pointerup',function(e){active=false;try{rail.releasePointerCapture(e.pointerId);}catch(_){} e.preventDefault();});
    rail.addEventListener('pointercancel',function(){active=false;});
  }
  function bindStageGesture(){
    const stage=byId('editStage');
    if(!stage || stage.dataset.v18Bound==='1') return;
    stage.dataset.v18Bound='1';
    const pts=new Map();
    let mode='', startX=0,startY=0,baseX=0,baseY=0,startDist=1,startSize=48,startCX=0,startCY=0,moved=false;
    function dist(){const a=Array.from(pts.values()); if(a.length<2)return 1; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
    function center(){const a=Array.from(pts.values()); if(a.length<2)return a[0]||{x:0,y:0}; return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}
    stage.addEventListener('pointerdown',function(e){
      if(e.target.closest && e.target.closest('#editPanel,#editSizeRail,#editTop')) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===1){ mode='drag'; moved=false; startX=e.clientX; startY=e.clientY; baseX=posX; baseY=posY; }
      if(pts.size===2){ const c=center(); mode='pinch'; moved=true; startDist=dist(); startSize=getEditSize(); startCX=c.x; startCY=c.y; baseX=posX; baseY=posY; editFocusInput(); }
      try{stage.setPointerCapture(e.pointerId);}catch(_){}
      e.preventDefault();
    },{passive:false});
    stage.addEventListener('pointermove',function(e){
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(mode==='drag' && pts.size===1){ if(Math.abs(e.clientX-startX)>6||Math.abs(e.clientY-startY)>6) moved=true; posX=Math.round(baseX+(e.clientX-startX)/(autoScale||1)); posY=Math.round(baseY+(e.clientY-startY)/(autoScale||1)); renderLite(); }
      if(mode==='pinch' && pts.size>=2){ const c=center(); const ratio=dist()/startDist; setEditSize(startSize*ratio,true); posX=Math.round(baseX+(c.x-startCX)/(autoScale||1)); posY=Math.round(baseY+(c.y-startCY)/(autoScale||1)); renderLite(); }
      e.preventDefault();
    },{passive:false});
    function up(e){ pts.delete(e.pointerId); if(pts.size===0){ if(mode==='drag' && !moved){ editFocusInput(); } mode=''; } else if(pts.size===1){ const p=Array.from(pts.values())[0]; mode='drag'; moved=false; startX=p.x; startY=p.y; baseX=posX; baseY=posY; } }
    stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  }
  function fit(){ layoutEditOverlay(); }
  bindInput(); bindSizeRail(); bindStageGesture();
  window.addEventListener('resize',fit);
  if(window.visualViewport){ window.visualViewport.addEventListener('resize',fit); window.visualViewport.addEventListener('scroll',fit); }
  window.__v18CleanEditorReady=true;
})();
</script>

#editOverlay.show{background:radial-gradient(circle at 50% -8%,rgba(255,106,0,.06),rgba(0,0,0,0) 30%),#000!important;}
/* ===== 頂列：純白「完成」、隱藏標題、淡化關閉鈕（更貼近 IG）===== */
#editOverlay.show #editTop{grid-template-columns:46px 1fr auto!important;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 6px!important;min-height:60px!important;}
#editOverlay.show .editTitle{display:none!important;}
#editOverlay.show #editDone{background:transparent!important;color:#fff!important;box-shadow:none!important;border-radius:8px!important;font-weight:700!important;font-size:18px!important;padding:8px 4px!important;letter-spacing:.02em!important;}
#editOverlay.show #editDone:active{opacity:.5!important;}
#editOverlay.show .editClose{width:40px!important;height:40px!important;border:0!important;background:transparent!important;color:rgba(255,255,255,.82)!important;font-size:30px!important;}
#editOverlay.show .editClose:active{opacity:.5!important;}

/* ===== 字型膠囊列：IG 風圓角藥丸 ===== */
#editOverlay.show #editFontRow{gap:9px!important;padding:2px 2px 9px!important;}
#editOverlay.show .ef-btn{min-width:auto!important;padding:9px 18px!important;border-radius:999px!important;border:0!important;background:rgba(255,255,255,.12)!important;color:#fff!important;font-size:15px!important;font-weight:800!important;}
#editOverlay.show .ef-btn.on{background:#fff!important;color:#111!important;}

/* ===== 工具列：IG icon 風（等寬均分）===== */
#editOverlay.show #editToolbar{height:56px!important;min-height:56px!important;border-radius:18px!important;background:rgba(20,20,22,.92)!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 10px 30px rgba(0,0,0,.4)!important;gap:2px!important;padding:6px!important;justify-content:space-between!important;}
#editOverlay.show .et-btn{flex:1 1 0!important;height:44px!important;min-width:0!important;width:auto!important;padding:0!important;border-radius:13px!important;background:transparent!important;color:#fff!important;font-size:21px!important;}
#editOverlay.show .et-btn.on,#editOverlay.show .et-btn:active{background:rgba(255,255,255,.18)!important;}
#editOverlay.show #etKeyboard{font-weight:800!important;}
.et-ico svg{width:26px!important;height:26px!important;display:block!important;}
/* 直書／橫書切換鈕：上方 icon ＋ 下方文字，依狀態只顯示其中一組（!important 蓋掉上面那條造成兩個 icon 疊在一起的規則）*/
#etDir.et-dir{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:1px!important;line-height:1!important;}
#etDir.et-dir svg{width:19px!important;height:19px!important;}
#etDir .et-dir-label{font-size:10px!important;font-weight:800!important;letter-spacing:.04em!important;}
#etDir .ic-v,#etDir .lab-v{display:none!important;}
#etDir .ic-h,#etDir .lab-h{display:block!important;}
#etDir.et-vmode .ic-h,#etDir.et-vmode .lab-h{display:none!important;}
#etDir.et-vmode .ic-v,#etDir.et-vmode .lab-v{display:block!important;}
#editOverlay.show #editColorDot{width:26px!important;height:26px!important;box-shadow:0 0 0 3px rgba(255,255,255,.14)!important;}
</style>
<script id="v19-ig-layout-caret-fix-script">
(function(){
  function v19Clamp(v,min,max){return Math.max(min,Math.min(max,v));}
  function v19GetVisibleColor(){try{if(typeof getEditVisibleColor==='function')return getEditVisibleColor();}catch(e){}return '#ff6a00';}
  function v19GetEditSize(){try{if(typeof getEditSize==='function')return getEditSize();}catch(e){}var el=document.getElementById('szSlider');var n=el?parseInt(el.value,10):56;return v19Clamp(Number.isFinite(n)?n:56,4,180);}
  function v19TextValue(tempText){if(typeof tempText==='string')return tempText;var input=document.getElementById('editInput');if(input&&typeof input.value==='string')return input.value;if(typeof lines!=='undefined'&&lines&&lines.join)return lines.join('\n');return '';}
  function v19SyncLinesFromValue(value){if(typeof lines==='undefined')return;var arr=String(value||'').replace(/\r/g,'').split('\n');arr=arr.slice(0,6).map(function(s){return Array.from(s).slice(0,25).join('');});if(arr.length===0)arr=[''];lines=arr;try{if(typeof offsets!=='undefined'){while(offsets.length<lines.length)offsets.push(0);offsets.length=lines.length;}}catch(e){}}
  window.renderLite=function(tempText){
    /* v30：編輯模式已關閉就不准執行。否則按完成後收鍵盤觸發的 resize 會在 40ms 後
       呼叫 renderLite，把剛畫好的果凍 SVG 蓋回扁平預覽字（這就是「字體反白／變回原樣」的真因）。 */
    if(typeof editOpen!=='undefined' && !editOpen) return;
    var block=document.getElementById('text-block');if(!block)return;
    var source=v19TextValue(tempText);v19SyncLinesFromValue(source);
    var arr=String(source||'').replace(/\r/g,'').split('\n').slice(0,6);if(arr.length===0)arr=[''];
    var hasText=arr.join('').length>0;if(!hasText)arr=['輸入文字'];
    block.innerHTML='';block.classList.add('v18-lite-editing');block.classList.toggle('horizontal',typeof textDirection==='undefined'||textDirection==='h');block.classList.toggle('lite-vmode',typeof textDirection!=='undefined'&&textDirection==='v');
    block.style.fontFamily=(typeof curFont==='string'&&curFont)?curFont:"-apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif";
    block.style.fontSize=v19GetEditSize()+'px';block.style.color=v19GetVisibleColor();
    var scale=(typeof autoScale==='number'&&autoScale>0)?autoScale:1;var x=(typeof posX==='number')?posX:0;var y=(typeof posY==='number')?posY:0;
    block.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';
    var horizontal=(typeof textDirection==='undefined'||textDirection==='h');var renderArr=arr; /* v30：直書欄序改由 CSS writing-mode 處理，不再手動反轉行序 */
    var caretIdx=renderArr.length-1; /* 游標固定放最後一行（最後輸入處）*/
    var vmode=(typeof textDirection!=='undefined'&&textDirection==='v');
    for(var i=0;i<renderArr.length;i++){
      var line=document.createElement('div');line.className='v18-lite-line';
      if(!hasText)line.classList.add('is-placeholder');
      if(vmode){
        var chs=Array.from(renderArr[i]||'');if(chs.length===0)chs=[''];
        for(var c=0;c<chs.length;c++){var vc=document.createElement('span');vc.className='lite-vchar';vc.textContent=chs[c];line.appendChild(vc);}
      } else {
        line.textContent=renderArr[i];
      }
      if(i===caretIdx){var caret=document.createElement('span');caret.className='v19-caret';line.appendChild(caret);}
      block.appendChild(line);
    }
    try{if(typeof applyPos==='function')applyPos();}catch(e){}
  };
  window.editFocusInput=function(){var input=document.getElementById('editInput');if(!input)return;try{input.focus();}catch(e){}try{var n=input.value.length;input.setSelectionRange(n,n);}catch(e){}setTimeout(function(){try{input.focus();}catch(e){}},0);};
  function bindV19Input(){var input=document.getElementById('editInput');if(!input||input.dataset.v19Bound==='1')return;input.dataset.v19Bound='1';var sync=function(){if(typeof editOpen!=='undefined'&&!editOpen)return;v19SyncLinesFromValue(input.value);window.renderLite(input.value);};['input','change','compositionstart','compositionupdate','compositionend','keyup','keydown'].forEach(function(ev){input.addEventListener(ev,function(){setTimeout(sync,0);},false);});}
  var oldLayout=window.layoutEditOverlay;
  window.layoutEditOverlay=function(){if(typeof oldLayout==='function'){try{oldLayout();}catch(e){}}var ov=document.getElementById('editOverlay');if(!ov||(typeof editOpen!=='undefined'&&!editOpen))return;if(window.visualViewport){ov.style.top=(window.visualViewport.offsetTop||0)+'px';ov.style.height=(window.visualViewport.height||window.innerHeight)+'px';}var panel=document.getElementById('editPanel');if(panel)panel.style.maxHeight='112px';try{if(typeof updateEditSizeRail==='function')updateEditSizeRail();}catch(e){}};
  bindV19Input();
  window.addEventListener('resize',function(){setTimeout(function(){try{window.layoutEditOverlay();window.renderLite();}catch(e){}},40);});
  if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){setTimeout(function(){try{window.layoutEditOverlay();}catch(e){}},40);});window.visualViewport.addEventListener('scroll',function(){setTimeout(function(){try{window.layoutEditOverlay();}catch(e){}},40);});}
})();
</script>

<style id="v20-panel-dock-style">
/* 面板改用 fixed 釘在鍵盤上方，移除高度上限避免工具列被裁掉 */
#editOverlay.show #editPanel{max-height:none!important;}
</style>
<script id="v20-panel-dock">
/* v20：把功能鍵面板（字型列＋工具列）固定在鍵盤正上方。
   不再單靠 overlay 高度 + flex（在部分情境下面板會被推到鍵盤後面或被裁掉），
   改用 visualViewport 算出鍵盤高度後 position:fixed 釘住，並給預覽區預留底部空間。 */
(function(){
  function dockPanel(){
    var ov=document.getElementById('editOverlay');
    if(!ov || !ov.classList.contains('show')) return;
    var panel=document.getElementById('editPanel');
    var stage=document.getElementById('editStage');
    var cpanel=document.getElementById('editColorPanel');
    if(!panel) return;
    /* v21：不再用 innerHeight - vv.height 反推鍵盤高度（在預覽器／WKWebView 會算成 0，
       面板被釘到 bottom:0 躲在鍵盤後面）。改用 visualViewport 直接把面板底邊貼到可視區底邊，
       不需要知道鍵盤多高，Safari 分頁／WKWebView／檔案預覽器都通用。 */
    var v=window.visualViewport;
    var vTop=v?(v.offsetTop||0):0;
    var vH=v?v.height:(window.innerHeight||0);
    var iH=window.innerHeight||vH;
    var ph=panel.offsetHeight||120;
    /* 底邊貼可視區底邊 */
    var top=Math.round(vTop+vH-ph);
    /* v22 夾限：面板頂端不准低於可視區頂端 + 60，也不准低於可視區底邊（整塊跑出去）。
       這樣就算 visualViewport 在這個環境回報怪數字，面板至少一定看得見。 */
    var maxTop=Math.round(vTop+vH-40); /* 至少露 40px */
    var minTop=Math.round(vTop+60);
    if(top>maxTop)top=maxTop;
    if(top<minTop)top=minTop;
    panel.style.position='fixed';
    panel.style.left='0';
    panel.style.right='0';
    panel.style.bottom='auto';
    panel.style.top=top+'px';
    panel.style.zIndex='50';
    panel.style.maxHeight='none';
    if(stage){ stage.style.paddingBottom=(ph+10)+'px'; }
    if(cpanel && cpanel.classList.contains('show')){
      /* v23：顏色面板的「底邊」貼齊整個面板（字型列＋工具列）的頂端，往上長。
         用面板實際 rect，不再靠 keyboard 推算，所以不會跳。高度受限可捲動，
         保證滑桿一定看得到、也絕不蓋住工具列。 */
      var pr=panel.getBoundingClientRect();
      var iH2=window.innerHeight||vH;
      cpanel.style.position='fixed';
      cpanel.style.left='12px';
      cpanel.style.right='12px';
      cpanel.style.top='auto';
      cpanel.style.bottom=Math.round(iH2-pr.top+8)+'px';
      cpanel.style.maxHeight=Math.max(160,Math.round(pr.top-vTop-16))+'px';
      cpanel.style.overflow='auto';
      cpanel.style.zIndex='55';
    }
  }
  var prev=window.layoutEditOverlay;
  window.layoutEditOverlay=function(){ if(typeof prev==='function'){try{prev();}catch(e){}} try{dockPanel();}catch(e){} };
  function kick(){
    [0,80,180,360].forEach(function(t){ setTimeout(function(){ try{window.layoutEditOverlay();}catch(e){} }, t); });
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',kick);
    window.visualViewport.addEventListener('scroll',kick);
  }
  window.addEventListener('resize',kick);
  var ov=document.getElementById('editOverlay');
  if(ov && 'MutationObserver' in window){
    new MutationObserver(function(){ if(ov.classList.contains('show')) kick(); }).observe(ov,{attributes:true,attributeFilter:['class']});
  }
  var inp=document.getElementById('editInput');
  if(inp){ inp.addEventListener('focus',kick); inp.addEventListener('input',function(){setTimeout(dockPanel,0);}); }
})();
</script>
