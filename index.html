<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JELLY TYPE STUDIO｜果凍字設計工具</title>
<style>
/* =========================================================
   JELLY TYPE STUDIO
   外部字體版：字體檔請放在 GitHub repo 的 fonts/ 資料夾
   不使用 ?. 或 ??，提高 iPhone Safari 相容性
   ========================================================= */

@font-face { font-family: 'MaokenAssorted'; src: url('fonts/貓啃.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'Cubic11'; src: url('fonts/cubic-11.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'GenkaiMincho'; src: url('fonts/genkai-mincho.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'MantouSans'; src: url('fonts/MantouSans-Regular.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'GenYoMincho'; src: url('fonts/GenYoMincho-Regular.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'BoutiqueBitmap9x9'; src: url('fonts/BoutiqueBitmap9x9.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'SweiDevilLeg'; src: url('fonts/SweiDevilLegCJKtc-Regular.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'ChaoHuaBiaoTi'; src: url('fonts/ChaoHuaBiaoTi.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'MaoKenMoSha'; src: url('fonts/貓啃磨沙.otf') format('opentype'); font-display: swap; }
@font-face { font-family: 'QingSongHand'; src: url('fonts/qingsong-handwriting.ttf') format('truetype'); font-display: swap; }

:root{
  --bg0:#030408;
  --bg1:#080b12;
  --bg2:#111827;
  --panel:#111725;
  --panel2:#151c2b;
  --panel3:#1b2434;
  --line:#2c3852;
  --line2:#43506b;
  --text:#f3f6fb;
  --muted:#8993a8;
  --dim:#586176;
  --orange:#ff7a1a;
  --orange2:#ffb14d;
  --cyan:#43d9ff;
  --good:#5ef2a9;
  --bad:#ff6473;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;}
body{
  background:
    radial-gradient(circle at 25% 10%, rgba(255,122,26,.14), transparent 28%),
    radial-gradient(circle at 78% 15%, rgba(67,217,255,.07), transparent 30%),
    linear-gradient(135deg,#020307 0%,#090d16 35%,#111827 70%,#050608 100%);
  overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(3,4,8,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:20}
.brand{display:flex;gap:18px;align-items:flex-end}.brand h1{margin:0;font-size:24px;letter-spacing:.08em;line-height:1}.brand .sub{font-size:14px;color:var(--muted);letter-spacing:.28em;margin-top:8px}.pill{padding:8px 13px;border:1px solid rgba(255,122,26,.45);background:rgba(255,122,26,.12);border-radius:999px;color:var(--orange2);font-weight:700;font-size:12px;letter-spacing:.08em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;min-height:calc(100vh - 76px)}
.stageWrap{position:relative;padding:28px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.08)}
.stageGlow{position:absolute;inset:0;background:radial-gradient(circle at 48% 42%, rgba(255,122,26,.15), transparent 30%),radial-gradient(circle at 44% 55%, rgba(67,217,255,.08), transparent 38%);pointer-events:none}
.stageCard{position:relative;width:min(92vw,900px);aspect-ratio:1/1;border-radius:42px;background:linear-gradient(145deg,rgba(17,24,39,.92),rgba(12,16,27,.92));box-shadow:0 30px 80px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.stageCard:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent);opacity:.45;pointer-events:none}.stageCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}.guide{position:absolute;left:20px;bottom:16px;color:rgba(255,255,255,.24);font-size:11px;letter-spacing:.15em}
.side{padding:22px;background:linear-gradient(180deg,rgba(14,18,29,.96),rgba(7,9,14,.98));overflow:auto;max-height:calc(100vh - 76px)}
.group{border:1px solid rgba(255,255,255,.1);background:rgba(20,26,40,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.input,.textarea,.select{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(4,6,12,.65);border-radius:16px;padding:14px 15px;outline:none}.textarea{min-height:94px;resize:vertical;line-height:1.6}.input:focus,.textarea:focus,.select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,26,.15)}
.fontGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fontBtn{border:1px solid rgba(255,255,255,.12);background:rgba(28,31,45,.9);border-radius:18px;padding:10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.fontBtn.active{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,122,26,.22),0 0 22px rgba(255,122,26,.18);background:linear-gradient(145deg,rgba(255,122,26,.18),rgba(28,31,45,.92))}.fontBtn .sample{font-size:30px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28)}.fontBtn .name{font-size:12px;font-weight:800;color:var(--muted)}.fontBtn.active .name{color:var(--orange2)}.fontBtn .status{font-size:10px;color:var(--dim)}.fontBtn.loaded .status{color:var(--good)}.fontBtn.missing .status{color:var(--bad)}
.sliderRow{display:grid;grid-template-columns:84px minmax(0,1fr) 52px;gap:10px;align-items:center;margin:10px 0}.sliderRow span{font-size:13px;color:var(--muted);font-weight:700}.value{text-align:right;color:var(--orange2)!important}input[type=range]{width:100%;accent-color:var(--orange)}
.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:17px;padding:14px 16px;font-weight:900;letter-spacing:.04em;background:linear-gradient(135deg,var(--orange),#ffae38);color:#08090d;box-shadow:0 12px 24px rgba(255,122,26,.18)}.btn.secondary{background:rgba(38,47,69,.9);color:var(--text);box-shadow:none;border:1px solid rgba(255,255,255,.11)}.btn.ghost{background:rgba(255,255,255,.06);color:var(--muted);box-shadow:none;border:1px solid rgba(255,255,255,.11)}.btn:active{transform:translateY(1px)}
.positionPad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}.positionPad .wide{grid-column:1/4}.moveBtn{border:1px solid rgba(255,255,255,.12);background:rgba(9,13,23,.85);border-radius:14px;padding:12px 8px;color:var(--text);font-weight:900}.moveBtn:active{background:rgba(255,122,26,.22)}
.statusLine{font-size:12px;color:var(--muted);line-height:1.5}.orange{color:var(--orange2)}
.fileHint{font-size:11px;color:var(--dim);line-height:1.7}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--orange2)}

@media (max-width: 900px){
  .topbar{height:auto;align-items:flex-start;gap:10px}.brand{display:block}.layout{grid-template-columns:1fr}.stageWrap{min-height:58vh;padding:18px;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}.stageCard{width:min(94vw,620px)}.side{max-height:none}.fontGrid{grid-template-columns:1fr 1fr}.brand h1{font-size:20px}.pill{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div>
        <h1>JELLY TYPE STUDIO</h1>
        <div class="sub">果凍字設計工具</div>
      </div>
      <div class="pill">iOS Frosted UI</div>
    </div>
    <div class="statusLine">字體來源：<span class="orange">GitHub / fonts/</span></div>
  </header>

  <main class="layout">
    <section class="stageWrap">
      <div class="stageGlow"></div>
      <div class="stageCard" id="stageCard">
        <canvas id="stageCanvas" class="stageCanvas"></canvas>
        <div class="guide" id="fontStatus">loading fonts...</div>
      </div>
    </section>

    <aside class="side">
      <section class="group">
        <div class="label">文字輸入</div>
        <textarea id="textInput" class="textarea" maxlength="90">但 你
請 的
你 出</textarea>
        <div class="statusLine">可多行。換字體後會等待字體載入再重新繪製。</div>
      </section>

      <section class="group">
        <div class="label">字體選擇</div>
        <div id="fontGrid" class="fontGrid"></div>
        <div class="fileHint" style="margin-top:12px">
          若顯示未載入，代表 <span class="mono">fonts/</span> 裡缺檔或檔名不一致。
        </div>
      </section>

      <section class="group">
        <div class="label">果凍參數</div>
        <div class="sliderRow"><span>字體大小</span><input id="sizeRange" type="range" min="42" max="180" value="112"><span class="value" id="sizeVal">112</span></div>
        <div class="sliderRow"><span>字距</span><input id="letterRange" type="range" min="-8" max="28" value="6"><span class="value" id="letterVal">6</span></div>
        <div class="sliderRow"><span>行距</span><input id="lineRange" type="range" min="70" max="210" value="150"><span class="value" id="lineVal">150</span></div>
        <div class="sliderRow"><span>彈跳</span><input id="bounceRange" type="range" min="0" max="22" value="8"><span class="value" id="bounceVal">8</span></div>
        <div class="sliderRow"><span>傾斜</span><input id="skewRange" type="range" min="-16" max="16" value="0"><span class="value" id="skewVal">0</span></div>
      </section>

      <section class="group">
        <div class="label">位置控制</div>
        <div class="sliderRow"><span>步進</span><input id="stepRange" type="range" min="1" max="40" value="10"><span class="value" id="stepVal">10px</span></div>
        <div class="positionPad">
          <div></div><button class="moveBtn" data-move="up">↑ 上</button><div></div>
          <button class="moveBtn" data-move="left">← 左</button><button class="moveBtn" data-move="reset">重設</button><button class="moveBtn" data-move="right">右 →</button>
          <div></div><button class="moveBtn" data-move="down">下 ↓</button><div></div>
          <div class="statusLine wide">位置讀值：<span class="orange" id="posVal">X 0 / Y 0</span></div>
        </div>
      </section>

      <section class="group">
        <div class="label">顏色</div>
        <div class="row">
          <input id="colorInput" class="input" type="color" value="#ff8a1f">
          <input id="shadowInput" class="input" type="color" value="#7b250c">
        </div>
      </section>

      <section class="group">
        <div class="label">匯出</div>
        <div class="btnRow">
          <button class="btn" id="exportPng">透明 PNG</button>
          <button class="btn secondary" id="exportHi">高解析 3x</button>
        </div>
        <button class="btn ghost" id="resetAll" style="width:100%;margin-top:10px">全部重設</button>
      </section>
    </aside>
  </main>
</div>

<script>
(function(){
  'use strict';

  var fonts = [
    { key:'maoken', name:'貓啃什錦黑', family:'MaokenAssorted', file:'fonts/貓啃.otf', sample:'永' },
    { key:'cubic', name:'俐方體 11 號', family:'Cubic11', file:'fonts/cubic-11.ttf', sample:'永' },
    { key:'genkai', name:'源界明朝', family:'GenkaiMincho', file:'fonts/genkai-mincho.ttf', sample:'裂' },
    { key:'mantou', name:'饅頭黑體', family:'MantouSans', file:'fonts/MantouSans-Regular.ttf', sample:'柔' },
    { key:'genyo', name:'源樣明體', family:'GenYoMincho', file:'fonts/GenYoMincho-Regular.ttf', sample:'永' },
    { key:'bitmap', name:'精品點陣 9×9', family:'BoutiqueBitmap9x9', file:'fonts/BoutiqueBitmap9x9.ttf', sample:'永' },
    { key:'devil', name:'獅尾惡腿黑體', family:'SweiDevilLeg', file:'fonts/SweiDevilLegCJKtc-Regular.ttf', sample:'永' },
    { key:'chaohua', name:'朝華標題', family:'ChaoHuaBiaoTi', file:'fonts/ChaoHuaBiaoTi.ttf', sample:'柔' },
    { key:'mosha', name:'貓啃磨沙', family:'MaoKenMoSha', file:'fonts/貓啃磨沙.otf', sample:'砂' },
    { key:'qingsong', name:'清松手寫體', family:'QingSongHand', file:'fonts/qingsong-handwriting.ttf', sample:'永' }
  ];

  var state = {
    fontKey:'genkai',
    fontFamily:'GenkaiMincho',
    x:0,
    y:0,
    size:112,
    letter:6,
    line:150,
    bounce:8,
    skew:0,
    color:'#ff8a1f',
    shadow:'#7b250c',
    anim:0,
    exporting:false
  };

  var canvas = document.getElementById('stageCanvas');
  var ctx = canvas.getContext('2d');
  var textInput = document.getElementById('textInput');
  var fontGrid = document.getElementById('fontGrid');
  var fontStatus = document.getElementById('fontStatus');
  var dpr = window.devicePixelRatio || 1;
  var loadedMap = {};

  function byId(id){ return document.getElementById(id); }

  function hexToRgb(hex){
    var h = String(hex).replace('#','');
    if(h.length === 3){ h = h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2); }
    var n = parseInt(h,16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }

  function rgba(hex,a){
    var c = hexToRgb(hex);
    return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';
  }

  function resizeCanvas(){
    var rect = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  function makeFontButtons(){
    fontGrid.innerHTML = '';
    var i;
    for(i=0;i<fonts.length;i++){
      var f = fonts[i];
      var btn = document.createElement('button');
      btn.className = 'fontBtn';
      btn.setAttribute('type','button');
      btn.setAttribute('data-key', f.key);
      btn.innerHTML = '<div class="sample" style="font-family:\''+f.family+'\', sans-serif">'+f.sample+'</div><div class="name">'+f.name+'</div><div class="status">檢查中</div>';
      btn.onclick = function(){ selectFont(this.getAttribute('data-key')); };
      fontGrid.appendChild(btn);
    }
    updateActiveFontButton();
  }

  function updateActiveFontButton(){
    var btns = fontGrid.getElementsByTagName('button');
    var i;
    for(i=0;i<btns.length;i++){
      var b = btns[i];
      if(b.getAttribute('data-key') === state.fontKey){ b.className = b.className.replace(' active','') + ' active'; }
      else { b.className = b.className.replace(' active',''); }
    }
  }

  function markFontStatus(key, ok){
    var btns = fontGrid.getElementsByTagName('button');
    var i;
    for(i=0;i<btns.length;i++){
      var b = btns[i];
      if(b.getAttribute('data-key') === key){
        b.className = b.className.replace(' loaded','').replace(' missing','');
        b.className += ok ? ' loaded' : ' missing';
        var s = b.getElementsByClassName('status')[0];
        if(s){ s.innerHTML = ok ? '已載入' : '未載入'; }
      }
    }
  }

  function findFont(key){
    var i;
    for(i=0;i<fonts.length;i++){ if(fonts[i].key === key){ return fonts[i]; } }
    return fonts[0];
  }

  function loadFont(f, cb){
    if(loadedMap[f.key] === true){ cb(true); return; }
    if(loadedMap[f.key] === false){ cb(false); return; }
    if(typeof FontFace === 'undefined'){
      if(document.fonts && document.fonts.load){
        document.fonts.load('64px "'+f.family+'"').then(function(){ loadedMap[f.key]=true; markFontStatus(f.key,true); cb(true); }).catch(function(){ loadedMap[f.key]=false; markFontStatus(f.key,false); cb(false); });
      } else { cb(true); }
      return;
    }
    var face = new FontFace(f.family, 'url("'+f.file+'")');
    face.load().then(function(loadedFace){
      document.fonts.add(loadedFace);
      loadedMap[f.key]=true;
      markFontStatus(f.key,true);
      cb(true);
    }).catch(function(){
      loadedMap[f.key]=false;
      markFontStatus(f.key,false);
      cb(false);
    });
  }

  function preloadAll(){
    var count = 0;
    var okCount = 0;
    var i;
    function done(ok){
      count++;
      if(ok){ okCount++; }
      fontStatus.innerHTML = '字體載入：'+okCount+' / '+fonts.length;
      if(count === fonts.length){
        fontStatus.innerHTML = '字體載入：'+okCount+' / '+fonts.length+'　目前：'+findFont(state.fontKey).name;
        draw();
      }
    }
    for(i=0;i<fonts.length;i++){
      loadFont(fonts[i], done);
    }
  }

  function selectFont(key){
    var f = findFont(key);
    state.fontKey = f.key;
    state.fontFamily = f.family;
    updateActiveFontButton();
    fontStatus.innerHTML = '切換字體中：'+f.name;
    loadFont(f, function(ok){
      if(ok){ fontStatus.innerHTML = '目前字體：'+f.name; }
      else { fontStatus.innerHTML = '缺少字體檔：'+f.file; }
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ draw(); }); }
      else { draw(); }
    });
  }

  function getLines(){
    var t = textInput.value || '';
    t = t.replace(/\r/g,'');
    var arr = t.split('\n');
    var out = [];
    var i;
    for(i=0;i<arr.length;i++){
      if(arr[i].length > 0){ out.push(arr[i]); }
    }
    if(out.length === 0){ out.push('果凍字'); }
    return out;
  }

  function drawRoundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.lineTo(x+w-r,y);
    c.quadraticCurveTo(x+w,y,x+w,y+r);
    c.lineTo(x+w,y+h-r);
    c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    c.lineTo(x+r,y+h);
    c.quadraticCurveTo(x,y+h,x,y+h-r);
    c.lineTo(x,y+r);
    c.quadraticCurveTo(x,y,x+r,y);
    c.closePath();
  }

  function drawLetter(c, ch, x, y, fontSize, family, phase){
    var bounce = state.exporting ? 0 : Math.sin(phase) * state.bounce;
    c.save();
    c.translate(x, y + bounce);
    c.transform(1, 0, Math.tan(state.skew * Math.PI / 180), 1, 0, 0);
    c.font = '900 '+fontSize+'px "'+family+'", "Noto Sans TC", sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;

    // 深層陰影
    c.strokeStyle = state.shadow;
    c.lineWidth = Math.max(5, fontSize * 0.12);
    c.globalAlpha = 0.75;
    c.strokeText(ch, 7, 9);
    c.globalAlpha = 1;

    // 外層果凍厚度
    c.strokeStyle = rgba(state.shadow, 0.82);
    c.lineWidth = Math.max(7, fontSize * 0.1);
    c.strokeText(ch, 3, 5);

    // 主體
    var grad = c.createLinearGradient(0, -fontSize*0.62, 0, fontSize*0.62);
    grad.addColorStop(0, '#ffd06e');
    grad.addColorStop(0.22, state.color);
    grad.addColorStop(0.72, '#d95717');
    grad.addColorStop(1, '#91310f');
    c.fillStyle = grad;
    c.fillText(ch, 0, 0);

    // 高光
    c.strokeStyle = 'rgba(255,255,255,0.42)';
    c.lineWidth = Math.max(1.5, fontSize * 0.025);
    c.strokeText(ch, -2, -3);
    c.fillStyle = 'rgba(255,255,255,0.22)';
    c.fillText(ch, -2, -4);

    // 亮邊
    c.strokeStyle = 'rgba(255,190,100,0.56)';
    c.lineWidth = Math.max(1.2, fontSize * 0.018);
    c.strokeText(ch, 0, 0);

    c.restore();
  }

  function measureLetters(c, text, fontSize, family){
    c.font = '900 '+fontSize+'px "'+family+'", "Noto Sans TC", sans-serif';
    var total = 0;
    var i;
    for(i=0;i<text.length;i++){
      total += c.measureText(text.charAt(i)).width;
      if(i < text.length-1){ total += state.letter; }
    }
    return total;
  }

  function drawTextBlock(c, width, height, scale){
    var lines = getLines();
    var fontSize = state.size * scale;
    var lineGap = state.line * scale;
    var family = state.fontFamily;
    var centerX = width/2 + state.x * scale;
    var centerY = height/2 + state.y * scale;
    var startY = centerY - ((lines.length - 1) * lineGap)/2;
    var i,j;
    for(i=0;i<lines.length;i++){
      var line = lines[i];
      var w = measureLetters(c,line,fontSize,family);
      var x = centerX - w/2;
      var y = startY + i*lineGap;
      for(j=0;j<line.length;j++){
        var ch = line.charAt(j);
        c.font = '900 '+fontSize+'px "'+family+'", "Noto Sans TC", sans-serif';
        var mw = c.measureText(ch).width;
        drawLetter(c, ch, x + mw/2, y, fontSize, family, state.anim + i*0.9 + j*0.55);
        x += mw + state.letter * scale;
      }
    }
  }

  function draw(){
    var rect = canvas.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    if(w < 2 || h < 2){ return; }
    ctx.clearRect(0,0,w,h);
    var bg = ctx.createRadialGradient(w*0.5,h*0.48,10,w*0.5,h*0.48,w*0.62);
    bg.addColorStop(0,'rgba(255,122,26,0.13)');
    bg.addColorStop(0.4,'rgba(17,24,39,0.22)');
    bg.addColorStop(1,'rgba(2,3,7,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,w,h);
    drawTextBlock(ctx,w,h,1);
  }

  function animate(){
    state.anim += 0.045;
    draw();
    window.requestAnimationFrame(animate);
  }

  function bindSliders(){
    var pairs = [
      ['sizeRange','sizeVal','size',''],
      ['letterRange','letterVal','letter',''],
      ['lineRange','lineVal','line',''],
      ['bounceRange','bounceVal','bounce',''],
      ['skewRange','skewVal','skew','°'],
      ['stepRange','stepVal','step','px']
    ];
    var i;
    for(i=0;i<pairs.length;i++){
      (function(p){
        var input = byId(p[0]);
        var val = byId(p[1]);
        input.oninput = function(){
          var n = parseInt(input.value,10);
          if(p[2] !== 'step'){ state[p[2]] = n; }
          val.innerHTML = n + p[3];
          draw();
        };
      })(pairs[i]);
    }
    byId('colorInput').oninput = function(){ state.color = this.value; draw(); };
    byId('shadowInput').oninput = function(){ state.shadow = this.value; draw(); };
    textInput.oninput = function(){ draw(); };
  }

  function updatePos(){ byId('posVal').innerHTML = 'X '+state.x+' / Y '+state.y; }
  function bindPosition(){
    var buttons = document.getElementsByClassName('moveBtn');
    var i;
    for(i=0;i<buttons.length;i++){
      buttons[i].onclick = function(){
        var step = parseInt(byId('stepRange').value,10);
        var m = this.getAttribute('data-move');
        if(m === 'left'){ state.x -= step; }
        if(m === 'right'){ state.x += step; }
        if(m === 'up'){ state.y -= step; }
        if(m === 'down'){ state.y += step; }
        if(m === 'reset'){ state.x = 0; state.y = 0; }
        updatePos(); draw();
      };
    }
  }

  function downloadBlob(blob, filename){
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); document.body.removeChild(a); }, 1200);
  }

  function exportCanvas(scale, transparent){
    var rect = canvas.getBoundingClientRect();
    var out = document.createElement('canvas');
    out.width = Math.floor(rect.width * scale);
    out.height = Math.floor(rect.height * scale);
    var c = out.getContext('2d');
    c.setTransform(1,0,0,1,0,0);
    state.exporting = true;
    if(!transparent){
      var g = c.createLinearGradient(0,0,out.width,out.height);
      g.addColorStop(0,'#030408');
      g.addColorStop(0.45,'#111827');
      g.addColorStop(1,'#050608');
      c.fillStyle = g;
      c.fillRect(0,0,out.width,out.height);
    } else {
      c.clearRect(0,0,out.width,out.height);
    }
    drawTextBlock(c, out.width, out.height, scale);
    state.exporting = false;
    out.toBlob(function(blob){
      if(blob){ downloadBlob(blob, transparent ? 'jelly-text-transparent.png' : 'jelly-text-3x.png'); }
    }, 'image/png');
  }

  function bindExport(){
    byId('exportPng').onclick = function(){
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ exportCanvas(2,true); }); }
      else { exportCanvas(2,true); }
    };
    byId('exportHi').onclick = function(){
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ exportCanvas(3,false); }); }
      else { exportCanvas(3,false); }
    };
    byId('resetAll').onclick = function(){
      state.x=0; state.y=0; state.size=112; state.letter=6; state.line=150; state.bounce=8; state.skew=0; state.color='#ff8a1f'; state.shadow='#7b250c';
      byId('sizeRange').value=112; byId('letterRange').value=6; byId('lineRange').value=150; byId('bounceRange').value=8; byId('skewRange').value=0; byId('colorInput').value='#ff8a1f'; byId('shadowInput').value='#7b250c';
      byId('sizeVal').innerHTML='112'; byId('letterVal').innerHTML='6'; byId('lineVal').innerHTML='150'; byId('bounceVal').innerHTML='8'; byId('skewVal').innerHTML='0°';
      updatePos(); draw();
    };
  }

  makeFontButtons();
  bindSliders();
  bindPosition();
  bindExport();
  updatePos();
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  preloadAll();
  selectFont('genkai');
  animate();
})();
</script>
</body>
</html>
